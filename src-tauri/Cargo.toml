[package]
name = "audiosyncmaster"
version = "2.10.0"
description = "Measure and correct audio/video sync offsets"
authors = ["Ionicboy"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "audiosyncmaster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dev-dependencies]
# The mock runtime lets the end-to-end test call a command exactly as the
# webview would, with the real Python engine behind it.
tauri = { version = "2.9.5", features = ["test"] }
# The remote-status integration test runs the fetch against a local server.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The remote switch and access password (docs/REMOTE-STATUS.md): the status
# document is fetched with the same HTTP stack and TLS provider the updater
# already brings in, the password is checked against its PBKDF2-SHA256 hash,
# and "this user has entered it" lives in the OS credential store.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
url = "2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
keyring = "4"

[target.'cfg(windows)'.dependencies]
# Finding an older all-users copy (MSI or per-machine NSIS) to point out.
winreg = "0.55"

# PBKDF2 with 600 000 rounds takes seconds unoptimised; debug builds and the
# tests check passwords at release speed.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3

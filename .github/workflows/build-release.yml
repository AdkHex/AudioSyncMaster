name: Test and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes in quick succession must not race each other to the same
# release number: the second waits for the first to finish (and is the only
# one queued -- an older waiting run is dropped, since the newest commit is
# the one to ship). Pull-request runs are simply superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Nobody bumps the version by hand any more; this job decides it. A push to
  # main is released as the next minor version after the latest release --
  # unless the repo's own version is newer, in which case that number was
  # chosen on purpose and is used as it is -- and only when something that
  # ships has changed since the last release: a push that touches docs, tests
  # or this workflow alone is tested and not published. The number decided
  # here is written into every version file by the build job before it
  # builds, so the app, the tag and latest.json all agree.
  #
  # Before this, a push whose version was already released was skipped with a
  # notice, and before that it built green and published nothing, because
  # tauri-action will not overwrite an existing release -- so the commit
  # looked shipped while every installed app stayed on the old build. Both
  # depended on someone remembering to bump five files.
  version:
    name: Decide the version
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.decide.outputs.value }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: read
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Decide which version this push is released as
        id: decide
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/decide-version.cjs
          reason="$(grep '^reason=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          if grep -q '^release=true' "$GITHUB_OUTPUT"; then
            echo "::notice::Releasing: $reason"
          else
            echo "::notice::Not releasing: $reason"
          fi

      - name: Check every version source agrees
        run: |
          pkg="${{ steps.read.outputs.value }}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo" ]; then
            echo "::error::Version mismatch. CI tags from package.json, but the app \
          reports tauri.conf.json -- if they disagree the updater compares the wrong number."
            exit 1
          fi

  # Nothing is published unless this passes first. The original workflow tagged
  # and released on every push with no verification at all.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements-dev.txt

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test

      - name: Generate fixtures
        run: python tests/make_fixtures.py

      - name: Python tests
        run: python tests/run_all.py

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stub the engine resource
        run: |
          # Tauri's build script fails if a declared resource path is missing,
          # so these checks cannot compile without one. A stub is enough:
          # nothing here runs the engine. The build job creates the real one and
          # smoke-tests it before packaging.
          mkdir -p src-tauri/resources/engine
          printf '#!/bin/sh\nexit 0\n' > src-tauri/resources/engine/audiosync-cli
          chmod +x src-tauri/resources/engine/audiosync-cli

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build v${{ needs.version.outputs.value }} (${{ matrix.os }})
    needs: [version, test, rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      # The version decided above, written into every file that carries one
      # before anything is installed or built: npm ci and the app read it
      # from here, and the tag is taken from it below.
      - name: Set the release version
        shell: bash
        run: node scripts/set-version.cjs "${{ needs.version.outputs.value }}"

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The smoke test below decodes a real fixture, so this job needs ffmpeg
      # too -- without it the packaged engine correctly refuses to work and the
      # check cannot tell that apart from a broken build.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements-dev.txt pyinstaller

      - name: Build the analysis engine
        shell: bash
        run: |
          # --onedir, NOT --onefile. A onefile build re-extracts its entire
          # payload to a temp directory on every launch; that measured 32-63
          # seconds per run on macOS. A directory build starts in ~0.12s.
          pyinstaller --onedir --clean --noconfirm --log-level WARN \
            --distpath build/engine --workpath build/pyi --specpath build/pyi \
            --name audiosync-cli \
            --paths . \
            --hidden-import audiosync \
            --hidden-import audiosync.analyze \
            --hidden-import audiosync.batch \
            --hidden-import audiosync.correlate \
            --hidden-import audiosync.matching \
            --hidden-import audiosync.media \
            --hidden-import audiosync.mux \
            --hidden-import audiosync.dubsync \
            --hidden-import audiosync.dubrender \
            --collect-all numpy \
            --exclude-module scipy \
            --exclude-module matplotlib \
            --exclude-module tkinter \
            --exclude-module PIL \
            --exclude-module pandas \
            --exclude-module pytest \
            python/bridge.py

          rm -rf src-tauri/resources/engine
          mkdir -p src-tauri/resources
          cp -R build/engine/audiosync-cli src-tauri/resources/engine
          [ "${{ runner.os }}" = "Windows" ] || chmod +x src-tauri/resources/engine/audiosync-cli

      - name: Verify the engine starts and measures correctly
        shell: bash
        run: |
          # An engine that cannot import its dependencies is the most common
          # packaging failure, and it is invisible until a user runs the app.
          # Measuring a known fixture also catches a build that starts but
          # computes garbage.
          if [ "${{ runner.os }}" = "Windows" ]; then
            ENGINE=./src-tauri/resources/engine/audiosync-cli.exe
          else
            ENGINE=./src-tauri/resources/engine/audiosync-cli
          fi

          echo '{"command":"ping"}' | "$ENGINE" | grep -q pong
          echo "engine responds"

          python tests/make_fixtures.py
          printf '%s\n' \
            '{"command":"analyze","mode":"movie","videoFiles":["tests/fixtures/offset_500ms_primary.wav"],"audioFile":"tests/fixtures/offset_500ms_secondary.wav","windowSeconds":8,"windowCount":3}' \
            '{"command":"shutdown"}' | "$ENGINE" > engine-check.jsonl
          python - <<'CHECK'
          import json, sys
          delay = None
          problems = []
          for line in open("engine-check.jsonl"):
              line = line.strip()
              if not line:
                  continue
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get("type") == "result":
                  delay = event.get("delayMs")
              elif event.get("type") == "error":
                  problems.append(event.get("message", "unknown error"))
          if delay is None:
              # Surface what the engine actually said; "no result" alone gives
              # no clue whether the build is broken or the runner lacks ffmpeg.
              detail = "; ".join(problems) or "engine emitted no result and no error"
              sys.exit(f"packaged engine produced no result: {detail}")
          if abs(delay - 500.0) > 10.0:
              sys.exit(f"packaged engine measured {delay:+.1f}ms, expected +500ms")
          print(f"engine measured {delay:+.1f}ms on a known +500ms fixture")
          CHECK

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # tauri-action builds, signs the updater artifacts with the private key,
      # and merges each platform's entry into a single latest.json on the
      # release. Installed apps poll that file, so it must exist and must list
      # every platform -- which is why all three jobs publish to the same tag.
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.value }}
          releaseName: AudioSyncMaster v${{ steps.version.outputs.value }}
          releaseBody: |
            Automated build of AudioSyncMaster v${{ steps.version.outputs.value }}.

            Installed apps offer this update automatically on next launch.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Confirm the release carries an update manifest
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release without latest.json silently strands every installed app,
          # and nothing else in this pipeline would notice.
          tag="v${{ steps.version.outputs.value }}"
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$tag" --json assets \
                 --jq '.assets[].name' | grep -qx 'latest.json'; then
              echo "latest.json is present on $tag"
              exit 0
            fi
            echo "waiting for latest.json (attempt $attempt)…"
            sleep 20
          done
          echo "::error::latest.json missing from $tag - installed apps will not see this update"
          exit 1

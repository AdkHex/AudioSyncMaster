name: Test and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Nothing is published unless this passes first. The original workflow tagged
  # and released on every push with no verification at all.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements-dev.txt

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test

      - name: Generate fixtures
        run: python tests/make_fixtures.py

      - name: Python tests
        run: python tests/run_all.py

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stub the engine resource
        run: |
          # Tauri's build script fails if a declared resource path is missing,
          # so these checks cannot compile without one. A stub is enough:
          # nothing here runs the engine. The build job creates the real one and
          # smoke-tests it before packaging.
          mkdir -p src-tauri/resources/engine
          printf '#!/bin/sh\nexit 0\n' > src-tauri/resources/engine/audiosync-cli
          chmod +x src-tauri/resources/engine/audiosync-cli

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build (${{ matrix.os }})
    needs: [test, rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements-dev.txt pyinstaller

      - name: Build the analysis engine
        shell: bash
        run: |
          # --onedir, NOT --onefile. A onefile build re-extracts its entire
          # payload to a temp directory on every launch; that measured 32-63
          # seconds per run on macOS. A directory build starts in ~0.12s.
          pyinstaller --onedir --clean --noconfirm --log-level WARN \
            --distpath build/engine --workpath build/pyi --specpath build/pyi \
            --name audiosync-cli \
            --paths . \
            --hidden-import audiosync \
            --hidden-import audiosync.analyze \
            --hidden-import audiosync.batch \
            --hidden-import audiosync.correlate \
            --hidden-import audiosync.matching \
            --hidden-import audiosync.media \
            --hidden-import audiosync.mux \
            --collect-all numpy \
            --exclude-module scipy \
            --exclude-module matplotlib \
            --exclude-module tkinter \
            --exclude-module PIL \
            --exclude-module pandas \
            --exclude-module pytest \
            python/bridge.py

          rm -rf src-tauri/resources/engine
          mkdir -p src-tauri/resources
          cp -R build/engine/audiosync-cli src-tauri/resources/engine
          [ "${{ runner.os }}" = "Windows" ] || chmod +x src-tauri/resources/engine/audiosync-cli

      - name: Verify the engine starts and measures correctly
        shell: bash
        run: |
          # An engine that cannot import its dependencies is the most common
          # packaging failure, and it is invisible until a user runs the app.
          # Measuring a known fixture also catches a build that starts but
          # computes garbage.
          if [ "${{ runner.os }}" = "Windows" ]; then
            ENGINE=./src-tauri/resources/engine/audiosync-cli.exe
          else
            ENGINE=./src-tauri/resources/engine/audiosync-cli
          fi

          echo '{"command":"ping"}' | "$ENGINE" | grep -q pong
          echo "engine responds"

          python tests/make_fixtures.py
          printf '%s\n' \
            '{"command":"analyze","mode":"movie","videoFiles":["tests/fixtures/offset_500ms_primary.wav"],"audioFile":"tests/fixtures/offset_500ms_secondary.wav","windowSeconds":8,"windowCount":3}' \
            '{"command":"shutdown"}' | "$ENGINE" > engine-check.jsonl
          python - <<'CHECK'
          import json, sys
          delay = None
          for line in open("engine-check.jsonl"):
              line = line.strip()
              if not line:
                  continue
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get("type") == "result":
                  delay = event.get("delayMs")
          if delay is None:
              sys.exit("packaged engine produced no result")
          if abs(delay - 500.0) > 10.0:
              sys.exit(f"packaged engine measured {delay:+.1f}ms, expected +500ms")
          print(f"engine measured {delay:+.1f}ms on a known +500ms fixture")
          CHECK

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # tauri-action builds, signs the updater artifacts with the private key,
      # and merges each platform's entry into a single latest.json on the
      # release. Installed apps poll that file, so it must exist and must list
      # every platform -- which is why all three jobs publish to the same tag.
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.value }}
          releaseName: AudioSyncMaster v${{ steps.version.outputs.value }}
          releaseBody: |
            Automated build of AudioSyncMaster v${{ steps.version.outputs.value }}.

            Installed apps offer this update automatically on next launch.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Confirm the release carries an update manifest
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release without latest.json silently strands every installed app,
          # and nothing else in this pipeline would notice.
          tag="v${{ steps.version.outputs.value }}"
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$tag" --json assets \
                 --jq '.assets[].name' | grep -qx 'latest.json'; then
              echo "latest.json is present on $tag"
              exit 0
            fi
            echo "waiting for latest.json (attempt $attempt)…"
            sleep 20
          done
          echo "::error::latest.json missing from $tag - installed apps will not see this update"
          exit 1
